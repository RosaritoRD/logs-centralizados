#  centralized logs (logs.your-domain.com).
#
# THIS STACK LIVES ON ITS OWN ON PURPOSE.
#
# It isn't in your website's folder or its docker-compose. The reason is simple: what
# WATCHES can't depend on what is WATCHED. If a website deploy goes wrong, or the
# `website` container won't start, the log viewer is exactly what you need to
# look at — and it has to stay up.
#
# The only shared piece is Nginx Proxy Manager, which terminates TLS for the
# whole server. It doesn't even go through the site's nginx: the proxy for
# logs.your-domain.com lives in NPM's /data/nginx/custom/http.conf, a file the
# NPM UI never touches.
#
# Start:   cd /opt/logs-centralizados && docker compose up -d
# Stop:    docker compose down          (doesn't affect the website at all)

services:
  # The store. It does NOT index log content, only labels (container, host,
  # file). That's why it fits here: an Elasticsearch indexing every word would
  # want 2-4 GB, and this VPS already has 2.6 GB in swap.
  loki:
    image: grafana/loki:3.3.2
    container_name: logs-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/config.yaml
    # All three have a memory cap. Without it, a heavy query could take the RAM
    # that n8n and the API need: the log viewer taking down the platform it
    # watches would be the worst possible ending.
    mem_limit: 512m
    volumes:
      - ./loki-config.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    networks:
      - logs_internal

  # The collector. It reads every container's logs (via the Docker socket) and
  # the host files (/var/log). BOTH mounts are READ-ONLY: Alloy reads; it has no
  # business writing to /var/log or giving orders to the Docker daemon.
  alloy:
    image: grafana/alloy:v1.18.1
    container_name: logs-alloy
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      # No anonymous telemetry to Grafana Labs. Besides not wanting to send it,
      # its "reporter" logs an error on every start and stop, polluting exactly
      # the log this stack exists to read.
      - --disable-reporting
      - /etc/alloy/config.alloy
    mem_limit: 256m
    volumes:
      - ./alloy-config.alloy:/etc/alloy/config.alloy:ro
      - /var/log:/var/log:ro
      # Container logs are read from DISK, not the Docker API (see the long
      # explanation in alloy-config.alloy). The socket is kept only to map
      # id -> container name.
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    networks:
      - logs_internal
    depends_on:
      - loki

  # The visible face. It's the ONLY one of the three on the proxy network:
  # Loki and Alloy live on an internal network with no way out.
  grafana:
    image: grafana/grafana:11.4.0
    container_name: logs-grafana
    restart: unless-stopped
    mem_limit: 384m
    env_file:
      - ./.env.grafana          # user and password, kept out of git (0600)
    environment:
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_SERVER_ROOT_URL: "https://logs.your-domain.com"
    volumes:
      # Data source AND dashboards are both provisioned: what you see on screen
      # and what's in git are always the same.
      - ./grafana-provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - logs_internal
      - proxy
    depends_on:
      - loki

networks:
  # Loki and Alloy can't be reached from outside: only Grafana queries them.
  logs_internal:
    internal: true
  # The network where Nginx Proxy Manager lives. The ONLY thing shared with the rest.
  proxy:
    external: true
    name: ${PROXY_NETWORK:-npm_default}

volumes:
  loki_data:
  alloy_data:
  grafana_data:
