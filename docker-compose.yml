#  registros centralizados (logs.tu-dominio.com).
#
# ESTE STACK VIVE APARTE A PROPÓSITO.
#
# No está en la carpeta de tu web ni en su docker-compose. La razón es simple y es
# la regla de oro: lo que VIGILA no puede depender de lo VIGILADO. Si un
# despliegue de la web sale mal, o el contenedor `website` no arranca, el
# visor de logs es justo lo que hace falta mirar — y tiene que seguir en pie.
#
# Lo único que se comparte es Nginx Proxy Manager, que es quien termina el
# TLS de todo el servidor. Y ni siquiera se pasa por el nginx del sitio: el
# reenvío de logs.tu-dominio.com está en /data/nginx/custom/http.conf de NPM,
# un fichero que la interfaz de NPM no toca nunca.
#
# Arrancar:   cd /opt/logs-centralizados && docker compose up -d
# Parar:      docker compose down          (no afecta a la web para nada)

services:
  # El almacén. NO indexa el contenido de los logs, solo las etiquetas
  # (contenedor, host, fichero). Por eso cabe aquí: un Elasticsearch indexando
  # cada palabra pediría 2-4 GB, y esta VPS ya tiene 2,6 GB en swap.
  loki:
    image: grafana/loki:3.3.2
    container_name: logs-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/config.yaml
    # Los tres llevan tope de memoria. Sin él, una consulta pesada podría
    # llevarse la RAM que necesitan n8n y la API: el visor de logs tumbando la
    # plataforma que vigila sería el peor final posible.
    mem_limit: 512m
    volumes:
      - ./loki-config.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    networks:
      - logs_internal

  # El recolector. Lee los logs de todos los contenedores por el socket de
  # Docker y los ficheros del host (/var/log). Los DOS montajes son de SOLO
  # LECTURA: Alloy lee, no tiene por qué escribir en /var/log ni mandarle
  # órdenes al demonio de Docker.
  alloy:
    image: grafana/alloy:v1.18.1
    container_name: logs-alloy
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      # Sin telemetría anónima a Grafana Labs. Además de no querer mandarla,
      # su "reporter" suelta un error en cada arranque y parada que ensucia
      # justo el registro que este stack existe para leer.
      - --disable-reporting
      - /etc/alloy/config.alloy
    mem_limit: 256m
    volumes:
      - ./alloy-config.alloy:/etc/alloy/config.alloy:ro
      - /var/log:/var/log:ro
      # Los logs de los contenedores se leen del DISCO, no de la API de Docker
      # (ver el porqué largo en alloy-config.alloy). El socket se conserva solo
      # para traducir id -> nombre de contenedor.
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    networks:
      - logs_internal
    depends_on:
      - loki

  # La cara visible. Es el ÚNICO de los tres que sale a la red del proxy:
  # Loki y Alloy viven en una red interna sin salida.
  grafana:
    image: grafana/grafana:11.4.0
    container_name: logs-grafana
    restart: unless-stopped
    mem_limit: 384m
    env_file:
      - ./.env.grafana          # usuario y contraseña, fuera de git (0600)
    environment:
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_SERVER_ROOT_URL: "https://logs.tu-dominio.com"
    volumes:
      # Origen de datos Y dashboards, los dos provisionados: lo que se ve en
      # pantalla y lo que está en git son siempre lo mismo.
      - ./grafana-provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - logs_internal
      - proxy
    depends_on:
      - loki

networks:
  # Loki y Alloy no se alcanzan desde fuera: solo Grafana los consulta.
  logs_internal:
    internal: true
  # La red donde vive Nginx Proxy Manager. Es lo ÚNICO compartido con el resto.
  proxy:
    external: true
    name: ${PROXY_NETWORK:-npm_default}

volumes:
  loki_data:
  alloy_data:
  grafana_data:
