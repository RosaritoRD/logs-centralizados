#  loads the dashboards from the directory on every start.
#
# `allowUiUpdates: false`: the dashboard is a file in the repo, not something
# edited in the UI and lost when the container is recreated. To change it, edit
# the JSON and restart — so what you see on screen and what's in git are always
# the same.
apiVersion: 1

providers:
  - name: logs
    orgId: 1
    folder: Server
    type: file
    disableDeletion: false
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
