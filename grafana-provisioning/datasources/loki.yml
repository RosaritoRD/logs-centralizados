#  Loki queda enchufado solo al arrancar Grafana.
#
# El `uid` es FIJO a propósito. Sin él Grafana genera uno aleatorio en cada
# instalación, y los paneles del dashboard —que referencian el origen de datos
# por uid— aparecerían vacíos al recrear el contenedor, sin decir por qué.
apiVersion: 1

datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    jsonData:
      maxLines: 2000
