#  Loki gets wired in automatically when Grafana starts.
#
# The `uid` is FIXED on purpose. Without it Grafana generates a random one on
# every install, and the dashboard panels — which reference the data source by
# uid — would show up empty after recreating the container, with no reason given.
apiVersion: 1

datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    jsonData:
      maxLines: 2000
