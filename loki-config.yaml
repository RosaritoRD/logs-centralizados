#  Loki, the log store.
#
# Loki does NOT index log content, only labels (container, host, file).
# That's why it fits on this VPS: an Elasticsearch indexing every word would
# need several GB, and there are already 2.6 GB in swap here.
#
# Everything on local disk, no external dependencies.

auth_enabled: false

server:
  http_listen_port: 3100
  # Only the internal Docker network can reach it; Grafana is the one querying it.
  http_listen_address: 0.0.0.0
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # 30 days. Nobody looks at a two-month-old log, but it does take disk: there
  # are 59 GB free and this machine also stores inspection photos.
  retention_period: 720h
  # Containers spit out bursts on startup; without this Loki rejects them.
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16
  reject_old_samples: true
  # 720h, not 168h: the containers have been writing for weeks, and on first
  # start Alloy sends ALL of that backlog. With 7 days, Loki returned 400 for
  # every batch and the older lines were lost. Matched to retention: accept
  # everything that will be kept, not a day more.
  reject_old_samples_max_age: 720h
  max_query_series: 5000

compactor:
  working_directory: /loki/compactor
  delete_request_store: filesystem
  retention_enabled: true
  retention_delete_delay: 2h

analytics:
  reporting_enabled: false
